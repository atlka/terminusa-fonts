<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- terminusa.conf -->
<fontconfig>
 <selectfont>
  <acceptfont>
   <pattern>
    <patelt name="family">
     <string>Terminusa</string>
    </patelt>
   </pattern>
  </acceptfont>
 </selectfont>
 <selectfont>
  <acceptfont>
   <pattern>
    <patelt name="family">
     <string>Terminusa Small</string>
    </patelt>
   </pattern>
  </acceptfont>
 </selectfont>
</fontconfig>
